# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "95e18de12e9140ab572fde0b0604aff2"
name = "Manca-quote-pipeline"
application_url = "https://manca-quote-pipeline.onrender.com/"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_draft_orders"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  topics = [ "draft_orders/create", "draft_orders/update", "draft_orders/delete" ]
  uri = "/webhooks/draft-orders"
  include_fields = [ "id", "status", "total_price", "currency", "created_at", "updated_at", "completed_at", "invoice_sent_at" ]

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
automatically_update_urls_on_dev = false